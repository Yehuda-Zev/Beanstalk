<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jack and the Beanstalk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#3b2a1a; --green:#2f5d34; --gold:#b8862b; --paper:#f4e8c8; --card:#fbf3dc; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 64px; color: var(--ink);
    font-family: 'Lora', Georgia, serif; line-height: 1.5;
    background: radial-gradient(circle at 50% 0%, #fff7dd 0%, var(--paper) 55%, #e6d4a3 100%);
    min-height: 100vh;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 {
    font-family: 'Playfair Display', Georgia, serif; font-weight: 900;
    font-size: clamp(2rem, 6vw, 3.2rem); color: var(--green);
    text-align: center; margin: 0 0 4px;
  }
  .tagline { text-align: center; font-style: italic; margin: 0 0 28px; }
  .rule { text-align: center; color: var(--gold); letter-spacing: .5em; margin: 0 0 24px; }
  .card {
    background: var(--card); border: 2px solid var(--gold); border-radius: 14px;
    padding: 24px; box-shadow: 0 6px 0 rgba(184,134,43,.25), 0 10px 30px rgba(59,42,26,.15);
  }
  #drop {
    border: 3px dashed var(--gold); border-radius: 12px; padding: 24px 16px;
    text-align: center; cursor: pointer; transition: background .2s;
  }
  #drop.over { background: #f1dfae; }
  #drop p { margin: 6px 0; }
  #preview {
    display: none; width: 140px; height: 140px; object-fit: cover;
    border-radius: 50%; border: 4px solid var(--gold); margin: 0 auto 8px;
  }
  .row { margin-top: 22px; }
  label { font-weight: 700; display: block; margin-bottom: 6px; }
  input[type=range] { width: 100%; accent-color: var(--green); }
  .ends { display: flex; justify-content: space-between; font-size: .85rem; font-style: italic; }
  #level { color: var(--green); font-weight: 700; }
  button#go {
    width: 100%; margin-top: 24px; padding: 14px; font: 700 1.15rem 'Playfair Display', serif;
    color: #fff; background: var(--green); border: 0; border-radius: 10px; cursor: pointer;
    box-shadow: 0 4px 0 #1f4023; transition: transform .1s;
  }
  button#go:hover:not(:disabled) { transform: translateY(-1px); }
  button#go:disabled { background: #9aa88f; box-shadow: 0 4px 0 #7b8872; cursor: not-allowed; }
  #error { color: #9b2c1d; font-weight: 700; text-align: center; margin-top: 14px; min-height: 1.2em; }

  #loading { display: none; text-align: center; margin-top: 28px; }
  .stalk-wrap { height: 120px; position: relative; width: 60px; margin: 0 auto; overflow: hidden; }
  .stalk {
    position: absolute; bottom: 0; left: 26px; width: 8px; height: 0;
    background: linear-gradient(#4f8f3a, #2f5d34); border-radius: 4px;
    animation: grow 4s ease-in-out infinite;
  }
  .leaf { position: absolute; width: 22px; height: 12px; background: #4f8f3a; border-radius: 0 100% 0 100%; opacity: 0; animation: leaf 4s ease-in-out infinite; }
  .leaf.l1 { bottom: 30px; left: 34px; animation-delay: .8s; }
  .leaf.l2 { bottom: 60px; left: 4px; transform: scaleX(-1); animation-delay: 1.6s; }
  .leaf.l3 { bottom: 90px; left: 34px; animation-delay: 2.4s; }
  @keyframes grow { 0% { height: 0; } 70%, 100% { height: 118px; } }
  @keyframes leaf { 0%, 20% { opacity: 0; } 40%, 100% { opacity: 1; } }
  #loadmsg { font-style: italic; margin-top: 8px; }

  #out { margin-top: 32px; display: grid; gap: 28px; }
  figure {
    margin: 0; background: var(--card); border: 2px solid var(--gold); border-radius: 12px;
    padding: 14px; box-shadow: 0 6px 0 rgba(184,134,43,.25), 0 10px 30px rgba(59,42,26,.15);
    animation: rise .6s ease both;
  }
  figure img { width: 100%; height: auto; border-radius: 8px; display: block; }
  figcaption { margin-top: 10px; text-align: center; font-style: italic; font-size: 1.05rem; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<main>
  <h1>Jack and the Beanstalk</h1>
  <p class="tagline">Step into the story. Upload a photo and become Jack.</p>
  <div class="rule">&#10022; &#10022; &#10022;</div>

  <div class="card">
    <div id="drop" tabindex="0">
      <img id="preview" alt="Your photo">
      <p id="droptext"><strong>Drop a photo here</strong><br>or click to choose one</p>
      <p style="font-size:.85rem;font-style:italic">A close-up, front-facing, well-lit face works best. JPG, PNG, or WebP.</p>
      <input type="file" id="photo" accept="image/jpeg,image/png,image/webp" hidden>
    </div>

    <div class="row">
      <label for="intensity">Illustration style: <span id="level"></span></label>
      <input type="range" id="intensity" min="1" max="10" value="6">
      <div class="ends"><span>Light sketch</span><span>Full cartoon</span></div>
    </div>

    <button id="go" disabled>Begin the Story</button>
    <div id="error"></div>

    <div id="loading">
      <div class="stalk-wrap">
        <div class="stalk"></div>
        <div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div>
      </div>
      <div id="loadmsg"></div>
    </div>
  </div>

  <div id="out"></div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const drop = $('drop'), input = $('photo'), preview = $('preview');
  const slider = $('intensity'), go = $('go'), errorBox = $('error');
  const OK = ['image/jpeg', 'image/png', 'image/webp'];
  let chosen = null;

  const LEVELS = ['Barely sketched', 'Light sketch', 'Light sketch', 'Storybook portrait',
    'Storybook portrait', 'Storybook', 'Inked cartoon', 'Inked cartoon', 'Bold cartoon', 'Full cartoon'];
  function showLevel() { $('level').textContent = LEVELS[slider.value - 1]; }
  slider.oninput = showLevel; showLevel();

  function setFile(f) {
    errorBox.textContent = '';
    if (!f) return;
    if (!OK.includes(f.type)) { errorBox.textContent = 'Please choose a JPG, PNG, or WebP image.'; return; }
    chosen = f;
    preview.src = URL.createObjectURL(f);
    preview.style.display = 'block';
    $('droptext').innerHTML = '<strong>Looking good!</strong><br>Click to choose a different photo';
    go.disabled = false;
  }

  drop.onclick = () => input.click();
  drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') input.click(); };
  input.onchange = () => setFile(input.files[0]);
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => setFile(e.dataTransfer.files[0]));

  const MESSAGES = ['Planting the magic beans...', 'Watering the soil...', 'The stalk is sprouting...',
    'Climbing toward the clouds...', 'Painting your pictures...'];
  let msgTimer;
  function startLoading() {
    let i = 0;
    $('loadmsg').textContent = MESSAGES[0];
    $('loading').style.display = 'block';
    msgTimer = setInterval(() => { i = (i + 1) % MESSAGES.length; $('loadmsg').textContent = MESSAGES[i]; }, 5000);
  }
  function stopLoading() { clearInterval(msgTimer); $('loading').style.display = 'none'; }

  go.onclick = async () => {
    if (!chosen) return;
    const fd = new FormData();
    fd.append('photo', chosen);
    fd.append('intensity', slider.value);
    go.disabled = true; errorBox.textContent = ''; $('out').innerHTML = '';
    startLoading();
    try {
      const r = await fetch('/generate', { method: 'POST', body: fd });
      let data = {};
      try { data = await r.json(); } catch { /* non-JSON response */ }
      if (!r.ok) { errorBox.textContent = data.error || 'Something went wrong. Please try again.'; return; }
      data.scenes.forEach(s => {
        const fig = document.createElement('figure');
        const img = document.createElement('img');
        img.src = s.image; img.alt = s.caption;
        const cap = document.createElement('figcaption');
        cap.textContent = s.caption;
        fig.append(img, cap);
        $('out').append(fig);
      });
      $('out').scrollIntoView({ behavior: 'smooth' });
    } catch {
      errorBox.textContent = 'Could not reach the server. Please try again.';
    } finally {
      stopLoading(); go.disabled = false;
    }
  };
</script>
</body>
</html>
