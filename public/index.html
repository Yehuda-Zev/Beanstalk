<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jack and the Beanstalk: Your Book</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; color: #2b2b2b; }
  h1 { font-size: 1.6rem; }
  label { display: block; margin-top: .9rem; font-weight: 600; }
  input[type=text], textarea { width: 100%; padding: .5rem; box-sizing: border-box; font: inherit; }
  button { margin-top: 1.2rem; padding: .7rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer; }
  #status { margin-top: 1.2rem; }
  .err { color: #b00020; }
</style>
</head>
<body>
<h1>Jack and the Beanstalk, starring your child</h1>
<form id="form">
  <label>Photo (JPG, PNG, or WebP)
    <input type="file" name="photo" accept="image/jpeg,image/png,image/webp" required>
  </label>
  <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
  <label>Child's name <input type="text" name="name" maxlength="60" required></label>
  <label>Age <input type="text" name="age" maxlength="20"></label>
  <label>Favorite thing <input type="text" name="favorite" maxlength="120"></label>
  <label>Best friend <input type="text" name="friend" maxlength="80"></label>
  <label>When I grow up <input type="text" name="dream" maxlength="120"></label>
  <label>More about me <textarea name="more" rows="3" maxlength="300"></textarea></label>
  <button id="go" type="submit">Make my book</button>
</form>
<div id="status" aria-live="polite"></div>

<script>
const form = document.getElementById('form');
const statusEl = document.getElementById('status');
const go = document.getElementById('go');

function show(msg, isErr) {
  statusEl.className = isErr ? 'err' : '';
  statusEl.textContent = msg;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  go.disabled = true;
  show('Uploading...');
  try {
    const res = await fetch('/generate', { method: 'POST', body: new FormData(form) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    poll(data.id);
  } catch (err) {
    show(err.message, true);
    go.disabled = false;
  }
});

async function poll(id) {
  try {
    const res = await fetch('/status/' + id);
    const s = await res.json();
    if (s.status === 'working') { show(s.message); return setTimeout(() => poll(id), 3000); }
    if (s.status === 'done') {
      statusEl.className = '';
      statusEl.innerHTML = 'Your book is ready! <a href="/download/' + id + '" download>Download JackAndTheBeanstalk.pdf</a>';
    } else {
      show(s.error || 'Generation failed.', true);
    }
  } catch {
    show('Lost connection. Please try again.', true);
  }
  go.disabled = false;
}
</script>
</body>
</html>
